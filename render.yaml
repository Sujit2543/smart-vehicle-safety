services:
  - type: web
    name: cardeal-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: cardeal-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: OTP_EXPIRY_SECONDS
        value: 600
      - key: OTP_MAX_ATTEMPTS
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 1000
      - key: OTP_RATE_LIMIT_MAX
        value: 50
      - key: APP_NAME
        value: Car Deal Smart Safety Tag
      - key: TAG_ID_PREFIX
        value: CD
      - key: TAG_ID_START
        value: 1001
      - key: DOCUMENT_PIN_MAX_ATTEMPTS
        value: 5
      - key: DOCUMENT_PIN_LOCKOUT_MINUTES
        value: 30
      - key: API_PREFIX
        value: /api/v1
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_PRESIGNED_URL_TTL
        value: 900
      # Set these manually in Render dashboard after deploy:
      # BASE_URL         = https://smart-vehicle-safety.vercel.app
      # FRONTEND_URL     = https://smart-vehicle-safety.vercel.app
      # ALLOWED_ORIGINS  = https://smart-vehicle-safety.vercel.app
      # AWS_ACCESS_KEY_ID       (optional — for real S3 document storage)
      # AWS_SECRET_ACCESS_KEY   (optional)
      # AWS_S3_BUCKET           (optional)

databases:
  - name: cardeal-db
    plan: free
    region: singapore
    databaseName: cardeal_db
    user: cardeal_user
